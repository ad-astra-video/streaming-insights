name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RTC decode dependency. services/media shells out to ffmpeg for the
      # one-shot decode of each sampled access unit, and the media e2e builds
      # its H264 fixture with it. The ubuntu-latest image does not ship ffmpeg:
      # without it every access unit decodes to zero frames (packets>0
      # frames=0) and the e2e dies on `spawnSync ffmpeg ENOENT`. Same
      # dependency the runtime Dockerfile installs.
      - name: Install ffmpeg (RTC decode dependency)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build runs before typecheck: workspace packages resolve each other
      # through `dist` (`main`/`types` in package.json), so `pnpm -r typecheck`
      # on a fresh checkout cannot resolve `@streaming-insights/*` until the
      # dependency packages have emitted declarations.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
